# MongoDB for local development (kivoni-api + kivoni-web + kivoni-mobile)
# Usage: docker compose up -d
# URI: mongodb://127.0.0.1:27017/kivoni  (same as .env.example)

services:
  mongo:
    image: mongo:7
    container_name: kivoni-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - kivoni_mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: kivoni
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  kivoni_mongo_data:
