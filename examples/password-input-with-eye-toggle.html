<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Password field with show/hide toggle</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color: #111;
      }
      body {
        max-width: 28rem;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.35rem;
      }
      .field {
        position: relative;
        display: flex;
        align-items: center;
      }
      .field input {
        width: 100%;
        box-sizing: border-box;
        padding: 0.65rem 2.75rem 0.65rem 0.75rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 8px;
      }
      .field input:focus {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
      }
      .toggle {
        position: absolute;
        right: 0.35rem;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 2.25rem;
        height: 2.25rem;
        padding: 0;
        border: none;
        border-radius: 6px;
        background: transparent;
        color: #444;
        cursor: pointer;
      }
      .toggle:hover {
        background: #f3f4f6;
        color: #111;
      }
      .toggle:focus-visible {
        outline: 2px solid #2563eb;
        outline-offset: 1px;
      }
      .toggle svg {
        width: 1.25rem;
        height: 1.25rem;
      }
    </style>
  </head>
  <body>
    <form autocomplete="on">
      <label for="password">Password</label>
      <div class="field">
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          placeholder="Enter password"
        />
        <button
          type="button"
          class="toggle"
          id="toggle-visibility"
          aria-label="Show password"
          aria-pressed="false"
        >
          <!-- Eye (hidden state → click to show) -->
          <svg
            id="icon-eye"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
            />
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
            />
          </svg>
          <!-- Eye slash (visible state → click to hide) -->
          <svg
            id="icon-eye-off"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
            stroke-width="1.5"
            stroke="currentColor"
            aria-hidden="true"
            style="display: none"
          >
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              d="M3.98 8.223A10.477 10.477 0 0 0 1.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.451 10.451 0 0 1 12 4.5c4.756 0 8.773 3.162 10.065 7.498a10.522 10.522 0 0 1-4.293 5.774M6.228 6.228 3 3m12.726 12.726L21 21M15.536 8.464a3 3 0 0 0-4.243 4.243m4.243-4.243L3 3"
            />
          </svg>
        </button>
      </div>
    </form>
    <script>
      (function () {
        const input = document.getElementById('password');
        const btn = document.getElementById('toggle-visibility');
        const iconEye = document.getElementById('icon-eye');
        const iconEyeOff = document.getElementById('icon-eye-off');

        btn.addEventListener('click', function () {
          const showing = input.type === 'text';
          input.type = showing ? 'password' : 'text';
          btn.setAttribute('aria-pressed', String(!showing));
          btn.setAttribute('aria-label', showing ? 'Show password' : 'Hide password');
          iconEye.style.display = showing ? 'block' : 'none';
          iconEyeOff.style.display = showing ? 'none' : 'block';
        });
      })();
    </script>
  </body>
</html>
